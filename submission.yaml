submission:
  title: "GridGuard AI — Predictive Power Grid Resilience & Crew Pre-positioning Platform" # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Over 70% of power grid transformers exceed their 25-year design life, and manual inspection processes cannot predict cascading failures during extreme weather events. Grid dispatchers and maintenance operations teams lose critical response time correlating SCADA sensor anomalies and severe storms, resulting in catastrophic outages that cost utilities an average of $18 per customer-hour in direct economic damages.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    GridGuard AI is an autonomous grid resilience intelligence system combining physics-informed IEEE C57.91 Arrhenius thermal aging, IEC 60599 multi-gas DGA telemetry, and dynamic weather compounding via an IBM Bob Model Context Protocol (MCP) server. It enables AI agents to continuously rank at-risk substations, formulate feeder switching contingency plans, and automatically dispatch certified crew pre-positioning orders before physical outages occur.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Physics-informed transformer degradation scoring fusing IEEE C57.91 Arrhenius thermal aging and IEC 60599 multi-gas Dissolved Gas Analysis (DGA)"
    - "Dynamic weather risk compounding engine with real-time risk multipliers for storm warnings, ice accretion, extreme heat, and severe wind gusts"
    - "Automated crew staging & pre-positioning optimizer matching mandatory OSHA certifications, tool inventories, and switching safety sequences"
    - "Comprehensive Model Context Protocol (MCP) server with 12 tools, 4 live grid resources, and 3 prompt workflows purpose-built for IBM Bob"
    - "Interactive Web Operations Center with real-time geospatial risk heatmap, scenario simulation engine, and EPRI-benchmarked avoided outage ROI metrics"

  tech_stack:
    languages: ["TypeScript", "JavaScript", "HTML", "CSS"] # REQUIRED
    frameworks: ["Node.js", "Express", "@modelcontextprotocol/sdk", "Zod"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol (MCP)", "watsonx.ai ready"]
    databases: ["Atomic JSON Store / GridStore"]
    other: ["IEEE C57.91", "IEC 60599", "ASTM D1816", "Docker Ready"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The mathematical fidelity and operational realism of our risk fusion engine: connecting IEEE/IEC physical degradation models directly with dynamic meteorological alerts into an autonomous IBM Bob MCP workflow. Rather than a generic dashboard, GridGuard generates actionable, OSHA-certified crew dispatch orders and feeder load-transfer switching sequences that save lives, preserve critical infrastructure, and prevent multimillion-dollar grid blackouts.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Telemetry is currently stored in an atomic local GridStore JSON file rather than a production enterprise SCADA time-series historian (such as InfluxDB or OSIsoft PI). Weather inputs are simulated and API-ingested rather than streaming live satellite NOAA radar feeds.

